<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Vip шторы">
  <!-- тёмный фон — контраст -->
  <rect width="32" height="32" rx="7" fill="#59412b"/>

  <!-- окно -->
  <rect x="7" y="8" width="18" height="19" rx="1.2" fill="#f7f1ea"/>
  <path d="M16 8.5v18M7.5 17.5h17" stroke="#59412b" stroke-width="1.35" opacity="0.28"/>

  <!-- карниз -->
  <rect x="4" y="5" width="24" height="3" rx="1.5" fill="#e8dfd4"/>
  <circle cx="4.5" cy="6.5" r="1.5" fill="#e8dfd4"/>
  <circle cx="27.5" cy="6.5" r="1.5" fill="#e8dfd4"/>

  <!-- левая штора (открыта, дуга к центру) -->
  <path
    fill="#c5cdd4"
    d="M5.5 8.2
       C9.5 8.5 12.2 10.5 13.8 14
       C12.2 16.5 11.2 20 11.6 27
       H5.5
       Z"
  />
  <!-- подхват -->
  <rect x="8.2" y="13.2" width="5" height="2.2" rx="1.1" fill="#3f2e1e"/>

  <!-- правая штора -->
  <path
    fill="#c5cdd4"
    d="M26.5 8.2
       C22.5 8.5 19.8 10.5 18.2 14
       C19.8 16.5 20.8 20 20.4 27
       H26.5
       Z"
  />
  <rect x="18.8" y="13.2" width="5" height="2.2" rx="1.1" fill="#3f2e1e"/>
</svg>
